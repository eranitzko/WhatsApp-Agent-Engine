services:
  bridge:
    build: ./bridge
    restart: unless-stopped
    volumes:
      - ./data/auth:/data/auth
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db
      - ./data/auth:/data/auth
    env_file: .env
    depends_on:
      - bridge
