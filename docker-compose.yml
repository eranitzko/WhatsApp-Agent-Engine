services:
  bridge:
    build: ./bridge
    restart: unless-stopped
    volumes:
      - ./data/auth:/data/auth
    environment:
      - BACKEND_URL=http://orchestrator:8000
      - AUTH_PATH=/data/auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db
      - ./data/auth:/data/auth
    env_file: .env
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
